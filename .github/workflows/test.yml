name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Verify bundle matches src/
        run: python3 build.py --check
      - name: Run Python tests
        run: python -m unittest discover --start-directory tests --verbose
      - name: Validate Python syntax
        run: python -B -c "import ast; ast.parse(open('hydra-rpc').read())"
      - name: Validate JSON (schema + example)
        run: python -c "import json; json.load(open('hydra-rpc.schema.json')); json.load(open('config.example.json')); print('JSON OK')"
      - name: Check Makefile targets
        run: make lint
      - name: Enforce config schema contract
        run: python3 scripts/check_config_schema.py
      - name: Live status JSON contract
        run: python3 scripts/check_status_contract.py
      - name: Verify updater checksum file
        run: python3 scripts/check_sha.py --check
      - name: Validate desktop entry
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y desktop-file-utils
          desktop-file-validate hydra-rpc.desktop
